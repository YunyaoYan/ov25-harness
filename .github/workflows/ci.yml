name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install
        run: pip install -e ".[dev,voice]"
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: python -m unittest discover -s tests -t .

  service-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install
        run: pip install -e ".[dev,voice]"
      - name: Start the server with fake backends
        run: |
          ov25-harness serve --config configs/local-fake.toml > server.log 2>&1 &
          for _ in $(seq 30); do
            curl -fsS http://127.0.0.1:8100/healthz && exit 0
            sleep 1
          done
          cat server.log
          exit 1
      - name: End-to-end check
        run: ov25-harness check http://127.0.0.1:8100 tests/data/frame.jpg
      - name: Server log
        if: always()
        run: cat server.log
