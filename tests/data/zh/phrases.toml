[rules]
# Utterances and the route the rules give them; "model" ones are left to the model router.
cancel = ["停止观察", "请停止观察。", "取消提醒", "别再提醒"]
past = ["刚才桌上有什么？", "刚刚他拿了什么？", "请看看，刚才画面里的人做了什么？"]
watch = ["看到猫的时候提醒我", "画面里有狗出现的时候提醒我", "每次看到红色的车就提醒我"]
model = ["桌上有什么？", "你是谁", "看到猫和狗的时候提醒我", "猫再次出现时提醒我", "猫离开的时候提醒我"]

[alerts]
# [utterance, the target the parser names]
targets = [
    ["看到猫的时候提醒我", "猫"],
    ["画面里有狗出现的时候提醒我", "狗"],
    ["每次看到红色的车就提醒我", "红色的车"],
]

